---
layout: default
---

<article class="note-page">
  <a class="back-link" href="{{ '/notes/' | relative_url }}"><span aria-hidden="true">←</span> All notes</a>

  <header class="note-header">
    <div class="note-kicker">
      <span>{{ page.course }}</span>
      <span>{{ page.sequence }}</span>
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.source_context %}
      <p class="note-source">{{ page.source_context }}</p>
    {% endif %}
    {% if page.tags %}
      <div class="tag-list" aria-label="Topics">
        {% for tag in page.tags %}
          <span>{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}
  </header>

  <div class="note-content">
    {{ content }}
  </div>

  <footer class="note-footer">
    <p>Part of the <a href="{{ '/notes/' | relative_url }}">public notes archive</a>.</p>
  </footer>
</article>
