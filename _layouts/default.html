<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e6">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="site-shell header-inner">
        <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="site-symbol" aria-hidden="true"></span>
          <span>{{ site.title }}</span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/notes/' | relative_url }}"{% if page.url == '/notes/' or page.collection == 'notes' %} aria-current="page"{% endif %}>Notes</a>
          <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        </nav>
      </div>
    </header>

    <main id="content" class="site-shell page-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-shell footer-inner">
        <p>an Euclidean space</p>
        <p>Proofs, definitions, and durable notes.</p>
      </div>
    </footer>

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
